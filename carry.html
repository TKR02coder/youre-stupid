<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" >
	<link rel="stylesheet" href="carri.css">
	<title>Azzka</title>
	
</head>
<body>
	<div class="card">
	<h1>Avrin bol suga bboy</h1>
	<h2>Yagaad gedgiig tailbarlay</h2>
	<p>Yagaad gevel ter tom biytei jijig tarhitai</p>

	<div class="buttons">
		<button id="runaway-btn">Suga bish</button>
		<button id="accept-btn">Huleen zuvshuuruh</button>
	</div>
</div>

	<script>
	const runawayBtn = document.getElementById('runaway-btn');
const acceptBtn = document.getElementById('accept-btn');

function moveButton() {
    runawayBtn.style.position = 'fixed';

    const maxX = window.innerWidth - runawayBtn.offsetWidth - 20;
    const maxY = window.innerHeight - runawayBtn.offsetHeight - 20;

    const randomX = Math.max(10, Math.floor(Math.random() * maxX));
    const randomY = Math.max(10, Math.floor(Math.random() * maxY));

    runawayBtn.style.left = randomX + 'px';
    runawayBtn.style.top = randomY + 'px';
}

runawayBtn.addEventListener('mouseover', moveButton);
runawayBtn.addEventListener('touchstart', moveButton);

acceptBtn.addEventListener('click', () => {
    alert('Zuv songolt! Minii huu');
});
	</script>
</body>
</html>
